<style>
    :root {
        --primary: #0E4C4F;
        --secondary: #1A7A7E;
        --accent: #2BA5A9;
        --light: #E8F4F5;
    }
    * {font-family: 'Cairo', sans-serif; scroll-behavior: smooth;}
    body {background-color: #fafafa;}
    .lang-en {display: none;}
    body.english .lang-ar {display: none;}
    body.english .lang-en {display: block;}
    body.english {direction: ltr;}
    .bg-primary { background-color: var(--primary); }
    .bg-secondary { background-color: var(--secondary); }
    .bg-accent { background-color: var(--accent); }
    .bg-light { background-color: var(--light); }
    .text-primary { color: var(--primary); }
    .text-secondary { color: var(--secondary); }
    .text-accent { color: var(--accent); }
    .btn-primary {
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(14, 76, 79, 0.2);
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(14, 76, 79, 0.35);
        background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
    }
    .btn-outline {
        border: 2px solid var(--primary);
        color: var(--primary);
        transition: all 0.3s ease;
    }
    .btn-outline:hover {background: var(--primary); color: white; transform: translateY(-2px);}
    .card-hover {transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
    .card-hover:hover {transform: translateY(-8px); box-shadow: 0 20px 40px rgba(14, 76, 79, 0.15);}
    .nav-link {position: relative; transition: color 0.3s ease;}
    .nav-link::after {
        content: '';
        position: absolute;
        bottom: -4px;
        right: 0;
        width: 0;
        height: 2px;
        background: var(--accent);
        transition: width 0.3s ease;
    }
    body.english .nav-link::after {right: auto; left: 0;}
    .nav-link:hover::after {width: 100%;}
    .gradient-text {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .hero-pattern {
        background-image: radial-gradient(circle at 20% 50%, rgba(43, 165, 169, 0.1) 0%, transparent 50%),
                          radial-gradient(circle at 80% 80%, rgba(26, 122, 126, 0.1) 0%, transparent 50%);
    }
    @keyframes fadeInUp {
        from {opacity: 0; transform: translateY(30px);}
        to {opacity: 1; transform: translateY(0);}
    }
    .animate-fade-in-up {animation: fadeInUp 0.8s ease-out forwards;}
    .section-divider {
        height: 4px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        width: 100px;
        margin: 1rem auto;
    }
    input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--accent) !important;
        box-shadow: 0 0 3px rgba(43, 165, 169, 0.1);
    }
    .social-icon {transition: all 0.3s ease;}
    .social-icon:hover {transform: translateY(-3px) scale(1.1); color: var(--accent) !important;}
    .lang-btn {
        background: var(--accent);
        color: white;
        padding: 6px 14px;
        border-radius: 6px;
        font-weight: bold;
        transition: all 0.3s;
    }
    .lang-btn:hover {background: var(--secondary);}
</style>
